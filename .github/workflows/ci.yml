# 자동 검사 (CI) — main에 올리거나 Pull Request를 열 때마다 GitHub 서버에서 실행된다.
#   test   : 테스트 전체를 SQLite와 PostgreSQL 컨테이너(서비스 컨테이너) 양쪽에서 실행
#   docker : Dockerfile로 이미지가 실제로 빌드되는지 확인 + Trivy로 이미지 취약점 검사
#   lint   : 셸 스크립트 문법 검사 (shellcheck)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:                       # 가상화 강의의 컨테이너 통합 테스트: 진짜 DB를 컨테이너로 띄워 검사
        image: postgres:17
        env:
          POSTGRES_USER: secretary
          POSTGRES_PASSWORD: secretary
          POSTGRES_DB: secretary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secretary -d secretary"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: OCR 프로그램 설치 (Docker 이미지와 같은 tesseract 한국어)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor
      - name: 파이썬 패키지 설치
        run: pip install -r requirements-dev.txt
      - name: 테스트 (SQLite)
        run: python -m pytest
      - name: 테스트 (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://secretary:secretary@localhost:5432/secretary
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드 (docker compose)
        run: docker compose build
      - name: 이미지 취약점 검사 (Trivy, 결과만 보고)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/file-secretary-api:0.1.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 셸 스크립트 검사
        run: shellcheck scripts/*.sh
